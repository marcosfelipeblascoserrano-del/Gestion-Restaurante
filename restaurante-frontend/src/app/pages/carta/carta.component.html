<!-- Hero specific for menu so navbar is visible -->
<div class="menu-hero position-relative text-white text-center d-flex align-items-center justify-content-center"
    style="min-height: 40vh;">
    <div class="hero-overlay position-absolute h-100 w-100 top-0 start-0"></div>
    <div class="position-relative z-1 mt-5">
        <h1 class="display-4 fw-bold text-white mb-2" style="text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);">Nuestra Carta
        </h1>
        <p class="lead text-white-75 mb-0" style="text-shadow: 0 1px 10px rgba(0, 0, 0, 0.5);">Descubre nuestros
            deliciosos platos, elaborados con pasión.</p>
    </div>
</div>

<div class="carta-container container py-5">

    <div *ngFor="let categoria of categoriasConPlatos" class="category-section mb-5">
        <div class="category-header border-bottom pb-2 mb-4 d-flex justify-content-between align-items-end">
            <div>
                <h2 class="h3 fw-bold mb-1">{{ categoria.nombre }}</h2>
                <p class="text-muted mb-0">{{ categoria.descripcion }}</p>
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-scroll rounded-circle" (click)="scrollLeft(scroller)"
                    aria-label="Deslizar a la izquierda">
                    <i class="bi bi-chevron-left"></i>
                </button>
                <button class="btn btn-outline-scroll rounded-circle" (click)="scrollRight(scroller)"
                    aria-label="Deslizar a la derecha">
                    <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>

        <div class="scroll-container d-flex gap-4 pb-4" #scroller>
            <div *ngFor="let plato of categoria.platos" class="dish-wrapper flex-shrink-0">
                <div class="card h-100 dish-card shadow-sm border-0 overflow-hidden rounded-4">
                    <!-- Dynamic image or a fallback -->
                    <div class="dish-img-container position-relative bg-light" style="height: 220px; overflow: hidden;">
                        <img [src]="plato.imagenUrl ? plato.imagenUrl : 'assets/fotosPlatos/pizza.png'"
                            class="w-100 h-100 dish-image" style="object-fit: cover; transition: transform 0.4s ease;"
                            alt="{{ plato.nombre }}" (error)="$any($event.target).src='assets/fotosPlatos/pizza.png'">
                        <div class="position-absolute top-0 end-0 m-3">
                            <span class="badge bg-dark rounded-pill shadow fs-6 px-3 py-2 fw-semibold text-white">
                                {{ plato.precio | currency:'EUR':'symbol' }}
                            </span>
                        </div>
                    </div>
                    <div class="card-body p-4 d-flex flex-column bg-white">
                        <h5 class="card-title fw-bold text-dark mb-2 fs-5">{{ plato.nombre }}</h5>
                        <p class="card-text text-secondary mb-3 small flex-grow-1" style="font-size: 0.92rem;">{{
                            plato.descripcion }}</p>

                        <!-- Optional allergen display -->
                        <div class="d-flex align-items-center mt-auto pt-3 border-top gap-2 overflow-hidden"
                            style="white-space: nowrap;" *ngIf="plato.alergenos && plato.alergenos.length > 0">
                            <span *ngFor="let alergeno of plato.alergenos"
                                class="badge bg-light text-secondary border border-light-subtle rounded-2 px-2 py-1">
                                {{ alergeno.nombre }}
                            </span>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
