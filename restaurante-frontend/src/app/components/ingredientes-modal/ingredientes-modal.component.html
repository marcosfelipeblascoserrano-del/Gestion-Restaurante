<div class="modal fade" id="ingredientesModal" tabindex="-1" aria-labelledby="ingredientesModalLabel"
    aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg" *ngIf="plato">

            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold" id="ingredientesModalLabel">
                    {{ plato.nombre }}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>

            <div class="modal-body pt-2">
                <p class="text-muted small mb-4">{{ plato.descripcion }}</p>

                <div class="row g-4">
                    <!-- Ingredientes (Columna Izquierda) -->
                    <div class="col-md-6 border-end">
                        <h6 class="fw-semibold mb-3 text-secondary text-uppercase"
                            style="font-size: 0.85rem; letter-spacing: 0.5px;">Ingredientes</h6>
                        <ul class="list-group list-group-flush"
                            *ngIf="plato.ingredientes && plato.ingredientes.length; else sinIngredientes">
                            <li *ngFor="let ing of plato.ingredientes"
                                class="list-group-item px-0 border-0 py-1 text-dark small d-flex align-items-center gap-2">
                                <i class="bi bi-dot text-primary fs-5"></i> {{ ing.nombre }}
                            </li>
                        </ul>
                        <ng-template #sinIngredientes>
                            <p class="text-muted fst-italic small">No hay ingredientes detallados.</p>
                        </ng-template>
                    </div>

                    <!-- Alérgenos (Columna Derecha) -->
                    <div class="col-md-6">
                        <h6 class="fw-semibold mb-3 text-secondary text-uppercase"
                            style="font-size: 0.85rem; letter-spacing: 0.5px;">Alérgenos</h6>

                        <div *ngIf="plato.alergenos && plato.alergenos.length; else sinAlergenos"
                            class="d-flex flex-wrap gap-2">
                            <span *ngFor="let al of plato.alergenos"
                                class="badge bg-warning bg-opacity-25 text-dark border border-warning rounded-pill px-3 py-2 d-flex align-items-center gap-1 shadow-sm">
                                <i class="bi bi-exclamation-triangle text-warning"></i> {{ al.nombre }}
                            </span>
                        </div>
                        <ng-template #sinAlergenos>
                            <p class="text-muted fst-italic small">Libre de alérgenos.</p>
                        </ng-template>
                    </div>
                </div>
            </div>

            <div class="modal-footer border-0 pt-0">
                <button type="button" class="btn btn-secondary rounded-3" data-bs-dismiss="modal">Cerrar</button>
            </div>

        </div>
    </div>
</div>
